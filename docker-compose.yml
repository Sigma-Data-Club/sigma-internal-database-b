services:
  db:
    image: postgres:16
    container_name: sigma_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: sigma_python
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - db
    command: bash -lc "python --version && sleep infinity"

volumes:
  pgdata:
